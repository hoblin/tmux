# vim:set ft=tmux:

# --> Cobalt2 Theme for Tmux
# Based on Wes Bos's Cobalt2 color scheme
# https://github.com/wesbos/cobalt2-vscode
#
# Semantic mapping: Cobalt2's design language → Catppuccin structure

# Base colors
set -ogq @thm_bg "#193549"           # Main editor background
set -ogq @thm_fg "#ffffff"           # Main text color

# PRIMARY ACCENT (#ffc600 yellow - active/attention elements)
set -ogq @thm_mauve "#ffc600"        # Active window number, primary accent
set -ogq @thm_lavender "#ffc600"     # Active borders, activity highlights

# SECONDARY ACCENTS
set -ogq @thm_teal "#80fcff"         # Messages, data (cyan from Cobalt2)
set -ogq @thm_sky "#9effff"          # Properties, secondary data (light cyan)
set -ogq @thm_blue "#0088ff"         # Clock, interactive elements (bright blue)
set -ogq @thm_sapphire "#80ffbb"     # Support/utility color

# SEMANTIC COLORS
set -ogq @thm_green "#3ad900"        # Success, strings, pane accents
set -ogq @thm_yellow "#ff9d00"       # Warnings, keywords, bell flags (orange in Cobalt2)
set -ogq @thm_peach "#ff9d00"        # Secondary warning/emphasis (orange)
set -ogq @thm_red "#ff628c"          # Errors, deletion (blush pink)
set -ogq @thm_maroon "#A22929"       # Strong errors (dark red)

# SPECIAL/TYPE COLORS
set -ogq @thm_pink "#ff0088"         # Hot pink for special elements
set -ogq @thm_flamingo "#fb94ff"     # Magenta for types/special
set -ogq @thm_rosewater "#ff628c"    # Blush pink for constants

# SURFACES AND OVERLAYS (layered backgrounds from darkest to lightest)
set -ogq @thm_crust "#15232d"        # Darkest (status bar, sidebar)
set -ogq @thm_mantle "#122738"       # Dark blue (inactive tabs, terminal bg)
set -ogq @thm_surface_0 "#193549"    # Main background (matches @thm_bg)
set -ogq @thm_surface_1 "#1F4662"    # Highlight 1 (current line)
set -ogq @thm_surface_2 "#234E6D"    # Highlight 2 (line border)
set -ogq @thm_overlay_0 "#0d3a58"    # Dark accent (borders, UI elements)
set -ogq @thm_overlay_1 "#355166"    # Medium overlay (scrollbar)
set -ogq @thm_overlay_2 "#406179"    # Light overlay (scrollbar hover)

# TEXT HIERARCHY (from dimmed to bright)
set -ogq @thm_subtext_1 "#aaaaaa"    # Dim text (descriptions, inactive)
set -ogq @thm_subtext_0 "#e1efff"    # Standard text (variables, punctuation)
